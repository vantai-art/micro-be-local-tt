# ==========================================
# CẤU HÌNH CƠ BẢN
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.port=8080
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# ==========================================
# SPRING CLOUD GATEWAY ROUTES
# FE gọi: /api/v1/{service}/...
# Gateway strip /api/v1 → forward đến BE
# ==========================================

# 0. Auth/User — /api/v1/auth/**, /api/v1/users/**
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/registration/**, /api/v1/roles/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/(?<segment>.*), /${segment}

# 1. Product catalog — /api/v1/products/**
spring.cloud.gateway.routes[1].id=product-catalog-service
spring.cloud.gateway.routes[1].uri=lb://product-catalog-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/products/**, /api/v1/admin/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/v1/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 2. Inventory (product-catalog-service) — /api/v1/inventory/**
spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=lb://product-catalog-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/inventory/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/v1/inventory/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[2].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 3. Order service — /api/v1/orders/**
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://order-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/tables/**, /api/v1/bills/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/v1/orders/(?<segment>.*), /${segment}

# 4. Payment service — /api/v1/payments/**
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/v1/payments/(?<segment>.*), /api/payments/${segment}

# 5. Setting service — /api/v1/settings/**
spring.cloud.gateway.routes[5].id=setting-service
spring.cloud.gateway.routes[5].uri=lb://setting-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/settings/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/v1/settings/(?<segment>.*), /settings/${segment}
spring.cloud.gateway.routes[5].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 6. HRM service — /api/v1/hrm/**
spring.cloud.gateway.routes[6].id=hrm-service
spring.cloud.gateway.routes[6].uri=lb://hrm-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/hrm/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/v1/(?<segment>.*), /${segment}

# 7. Accounting service — /api/v1/accounting/**
spring.cloud.gateway.routes[7].id=accounting-service
spring.cloud.gateway.routes[7].uri=lb://accounting-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/accounting/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/v1/(?<segment>.*), /${segment}

# ==========================================
# SPRING SESSION
# ==========================================
spring.session.store-type=none

