# ==========================================
# CẤU HÌNH CƠ BẢN
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.port=8080
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# ==========================================
jwt.secret=RainbowForestSuperSecretKeyForJWT2025MustBe256Bits!!
# ==========================================


# ==========================================
# GATEWAY ROUTES — FE gọi /api/v1/** → rewrite → backend
# ==========================================

# 0. User/Auth service (8811)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/login,/api/v1/registration,/api/v1/registration/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[0].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 1. Product catalog (8810) — /products/**, /admin/**
spring.cloud.gateway.routes[1].id=product-catalog-service
spring.cloud.gateway.routes[1].uri=lb://product-catalog-service
